---
# Phase 1: Build dynamic inventory with per-host network variables
- name: Create inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../config/secrets.yaml
  tasks:
    - name: Add vault host
      ansible.builtin.add_host:
        name: vault
        ansible_ssh_host: vault
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_python_interpreter: /usr/libexec/platform-python
        net_interface: eth1
        net_address: 192.168.1.12/24
        net_dns: "192.168.1.11"
        net_dns_search: zta.lab

    - name: Add netbox host
      ansible.builtin.add_host:
        name: netbox
        ansible_ssh_host: netbox
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_python_interpreter: /usr/libexec/platform-python
        net_interface: eth1
        net_address: 192.168.1.15/24
        net_dns: ""
        net_dns_search: ""

    # - name: Add wazuh host
    #   ansible.builtin.add_host:
    #     name: wazuh
    #     ...

    - name: Add central host
      ansible.builtin.add_host:
        name: central
        ansible_ssh_host: central
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_python_interpreter: /usr/libexec/platform-python
        net_interface: enp2s0
        net_address: 192.168.1.11/24
        net_dns: ""
        net_dns_search: ""

    - name: Add control host
      ansible.builtin.add_host:
        name: control
        ansible_ssh_host: control
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_python_interpreter: /usr/libexec/platform-python
        net_interface: eth1
        net_address: 192.168.1.10/24
        net_dns: "192.168.1.11"
        net_dns_search: zta.lab

# Phase 2: Common bootstrap on all hosts in parallel (~90s)
# SELinux, firewalld, /etc/hosts, nmcli, RHSM registration
- name: Common bootstrap
  hosts: all:!localhost
  gather_facts: false
  become: true
  vars_files:
    - ../config/secrets.yaml
  vars:
    tmm_org: "{{ tmm_orgid }}"
    tmm_id: "{{ tmm_activation }}"
    hosts_entries:
      - ip: 192.168.1.10
        names: control.zta.lab control aap.zta.lab
      - ip: 192.168.1.11
        names: central.zta.lab central keycloak.zta.lab opa.zta.lab splunk.zta.lab db.zta.lab app.zta.lab ceos1.zta.lab ceos2.zta.lab ceos3.zta.lab
      - ip: 192.168.1.12
        names: vault.zta.lab vault
      - ip: 192.168.1.15
        names: netbox.zta.lab netbox
      - ip: 192.168.1.13
        names: wazuh.zta.lab wazuh
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Run common bootstrap tasks
      ansible.builtin.include_tasks: tasks/common-bootstrap.yml

# Phase 3: Host-specific bootstrap in parallel (~300s, netbox bottleneck)
# vault: license + unseal
# netbox: Docker + compose + wait-for-ready
# central: packages, Keycloak, IPA, companion playbooks, container pre-install
# control: packages, collections install, companion repo clone
- name: Host-specific bootstrap
  hosts: all:!localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - ../config/secrets.yaml
  vars:
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"
    domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
    ah_token: "{{ ahtoken }}"
    vault_license: "{{ vaultlic }}"
  tasks:
    - name: Run host-specific bootstrap
      ansible.builtin.include_tasks:
        file: "tasks/{{ inventory_hostname }}-bootstrap.yml"

# Phases 4+5: Central + Control configure in parallel (~200s, was ~380s sequential)
#
# Uses strategy: free so each host progresses independently:
#   - central: waits for Vault + NetBox, then runs wave-based parallel configure
#   - control: waits for Vault KV engine, then runs wave-based parallel AAP configure
#
# Cross-host dependency (control needs Vault KV from central's configure-vault)
# is handled naturally by control's Vault KV wait loop.
- name: Configure central and control services
  hosts: central,control
  strategy: free
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - ../config/secrets.yaml
  vars:
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"
    domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
  tasks:
    # --- Central pre-checks ---
    - name: "Central: wait for Vault to be unsealed"
      ansible.builtin.command: vault status -address=http://127.0.0.1:8200
      delegate_to: vault
      register: r_vault_ready
      until: r_vault_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: inventory_hostname == 'central'

    - name: "Central: wait for NetBox to be responsive"
      ansible.builtin.uri:
        url: http://127.0.0.1:8000
        status_code: 200
      delegate_to: netbox
      register: r_netbox_ready
      until: r_netbox_ready.status == 200
      retries: 30
      delay: 10
      changed_when: false
      when: inventory_hostname == 'central'

    # --- Control pre-checks ---
    - name: "Control: wait for Vault KV secret engine"
      ansible.builtin.uri:
        url: "http://192.168.1.12:8200/v1/sys/internal/ui/mounts/secret"
        status_code: [200, 403, 404]
      register: r_vault_kv_ready
      until: r_vault_kv_ready.status in [200, 403]
      retries: 30
      delay: 10
      become: false
      when: inventory_hostname == 'control'

    # --- Host-specific configure waves ---
    - name: Run host-specific configure tasks
      ansible.builtin.include_tasks:
        file: "tasks/{{ inventory_hostname }}-configure.yml"
